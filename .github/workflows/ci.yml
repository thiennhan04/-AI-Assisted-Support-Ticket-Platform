name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate local infrastructure Compose file
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Verify reactor
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  container-images:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - identity-service
          - ticket-service
          - ai-orchestrator-service
          - knowledge-service
          - ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build OCI image
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -pl services/${{ matrix.module }} -am
          -DskipTests package spring-boot:build-image-no-fork
