openapi: 3.0.3
info:
  title: Knowledge Internal Search API
  version: 1.0.0
  description: Service JWT with tenant-bound user delegation. Ordinary user access tokens are rejected.
servers:
  - url: http://localhost:8084
security:
  - serviceBearer: []
paths:
  /internal/v1/knowledge/search:
    post:
      operationId: searchKnowledge
      description: Exact cosine search over authorized active chunks in the configured embedding space. All identity fields must match signed JWT delegation claims. All requested tags must match. Locale filtering is not implemented and unknown fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId, principalId, roles, query]
              properties:
                tenantId: {type: string, format: uuid}
                principalId: {type: string, format: uuid}
                roles:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: {type: string, enum: [CUSTOMER, AGENT, ADMIN]}
                query: {type: string, minLength: 1, maxLength: 2000}
                topK: {type: integer, minimum: 1, maximum: 20, default: 8}
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    tags:
                      type: array
                      maxItems: 20
                      items: {type: string, minLength: 1, maxLength: 50}
      responses:
        '200':
          description: Authorized matches sorted by cosine similarity descending. Empty results are valid.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  type: object
                  properties:
                    chunkId: {type: string, format: uuid}
                    documentId: {type: string, format: uuid}
                    title: {type: string}
                    version: {type: integer}
                    pageNumber: {type: integer, nullable: true}
                    heading: {type: string, nullable: true}
                    excerpt: {type: string, maxLength: 1500}
                    score: {type: number, format: double, minimum: -1, maximum: 1}
        '400': {description: Invalid query, topK or filters}
        '401': {description: Invalid signature, issuer, audience, service subject, expiry or delegation claims}
        '403': {description: Missing knowledge search scope or request identity differs from signed delegation}
        '503': {description: Embedding provider or database unavailable}
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256; aud=knowledge-internal, sub=ai-orchestrator-service, scope=knowledge:search, tid, principal_id and roles required. Issuer/JWKS are configured server-side.'
