openapi: 3.0.3
info:
  title: AI-Assisted Support Ticket Platform API
  version: 1.0.0
  description: External API contract. Internal service APIs are documented in service detail designs.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Tickets
  - name: AI Features
  - name: Knowledge
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/auth/logout:
    post:
      tags: [Auth]
      security: []
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '204': {description: Refresh-token family revoked or already absent}
        '400': {$ref: '#/components/responses/BadRequest'}
  /v1/tickets:
    post:
      tags: [Tickets]
      operationId: createTicket
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTicketRequest'}
      responses:
        '201':
          description: Created; AI analysis is asynchronous
          headers:
            ETag:
              schema: {type: string, example: '"0"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Tickets]
      operationId: listTickets
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TicketStatus'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/Priority'}}
        - {name: category, in: query, schema: {$ref: '#/components/schemas/Category'}}
        - {name: assigneeId, in: query, schema: {type: string, format: uuid}}
        - {name: requesterId, in: query, schema: {type: string, format: uuid}}
        - {name: createdFrom, in: query, schema: {type: string, format: date-time}}
        - {name: createdTo, in: query, schema: {type: string, format: date-time}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - name: sort
          in: query
          schema:
            type: string
            default: updatedAt,desc
            example: createdAt,asc
      responses:
        '200':
          description: Page of authorized tickets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketPage'}
  /v1/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      operationId: getTicket
      responses:
        '200':
          description: Ticket detail
          headers:
            ETag:
              schema: {type: string, example: '"4"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Tickets]
      operationId: updateTicket
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: {type: string, example: '"4"'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTicketRequest'}
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              schema: {type: string, example: '"5"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /v1/tickets/{ticketId}/comments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      operationId: listTicketComments
      responses:
        '200':
          description: Visible comments in chronological order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TicketComment'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Tickets]
      operationId: addComment
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: {type: string, example: '"4"'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 10000}
                internal: {type: boolean, default: false}
      responses:
        '201':
          description: Comment created
          headers:
            ETag:
              schema: {type: string, example: '"5"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketComment'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /v1/tickets/{ticketId}/ai-drafts:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [AI Features]
      operationId: requestAiDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: {type: string, default: en}
                tone: {type: string, enum: [PROFESSIONAL, FRIENDLY, CONCISE], default: PROFESSIONAL}
      responses:
        '202':
          description: Draft job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiJobReference'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/tickets/{ticketId}/ai-drafts/{draftId}/approve:
    post:
      tags: [AI Features]
      operationId: approveAiDraft
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - name: draftId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [editedBody]
              properties:
                editedBody: {type: string, minLength: 1, maxLength: 10000}
                internal: {type: boolean, default: false}
      responses:
        '201': {description: Approved text created as agent comment}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/tickets/{ticketId}/ai-feedback:
    post:
      tags: [AI Features]
      operationId: submitAiFeedback
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, rating]
              properties:
                targetId: {type: string, format: uuid}
                rating: {type: integer, minimum: 1, maximum: 5}
                reason: {type: string, maxLength: 1000}
      responses:
        '204': {description: Feedback accepted}
  /v1/knowledge/documents:
    post:
      tags: [Knowledge]
      operationId: uploadDocument
      description: Admin-only single-request upload. Actual MIME, size and SHA-256 are determined by the server. A repeated successful request creates a new document.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata: {$ref: '#/components/schemas/CreateDocumentRequest'}
                file:
                  type: string
                  format: binary
                  description: Non-empty PDF, DOCX or UTF-8 text file, maximum 25 MiB
            encoding:
              metadata: {contentType: application/json}
      responses:
        '201':
          description: File stored, QUEUED metadata and durable ingestion request saved
          headers:
            ETag: {description: Quoted current file version number for replacement If-Match, schema: {type: string, example: '"1"'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: File exceeds 25 MiB or multipart request exceeds 26 MiB
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '422':
          description: Actual content is not a supported document format
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '503':
          description: Storage or persistence unavailable, or upload capacity exhausted
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    get:
      tags: [Knowledge]
      operationId: listDocuments
      description: Admin-only metadata for the authenticated tenant, newest first. No object keys or download URLs are exposed.
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Current document metadata
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DocumentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/knowledge/documents/{documentId}:
    delete:
      tags: [Knowledge]
      operationId: deleteDocument
      description: Admin-only. Immediately hides all versions from search and durably schedules object/chunk cleanup. Repeated deletion is idempotent. Metadata tombstones remain available to administrators.
      parameters:
        - name: documentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '202': {description: Search access removed; cleanup accepted or already completed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Deletion could not be committed; retry later}
    get:
      tags: [Knowledge]
      operationId: getDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Admin-only metadata for a document in the authenticated tenant, including deletion tombstones
          headers:
            ETag: {description: Quoted current file version number for replacement If-Match, schema: {type: string, example: '"1"'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/knowledge/documents/{documentId}/versions:
    post:
      tags: [Knowledge]
      operationId: replaceDocumentFile
      description: Stage a replacement file under the same document. Title, visibility and tags are preserved. The previous active version remains searchable until successful activation. One pending version at a time.
      parameters:
        - name: documentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: If-Match
          in: header
          required: true
          description: Quoted current version number returned as ETag by document GET/upload/replacement. This token guards replacement creation, not every status change.
          schema: {type: string, example: '"1"'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: PDF/DOCX/UTF-8 text, maximum 25 MiB}
      responses:
        '201':
          description: Replacement QUEUED with an ingestion outbox event; previous active pointer unchanged
          headers:
            ETag: {description: Quoted new version number, schema: {type: string, example: '"2"'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Document deleted, current version still processing, or version limit reached}
        '412': {description: Current version changed; reload the document}
        '413': {description: File exceeds 25 MiB or multipart request exceeds 26 MiB}
        '422': {description: Unsupported actual file type}
        '428': {description: If-Match header required}
        '503': {description: Storage or persistence unavailable}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CreateDocumentRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        visibility: {type: string, enum: [ALL_TENANT_USERS, SUPPORT_TEAM_ONLY, LIMITED_ACCESS], default: SUPPORT_TEAM_ONLY}
        tags: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 50}}
    DocumentResponse:
      type: object
      required: [documentId, title, fileName, visibility, tags, status, versionId, versionNumber, mimeType, sizeBytes, createdAt, updatedAt]
      properties:
        activeVersionId: {type: string, format: uuid, nullable: true, description: Version currently used by search}
        documentStatus: {type: string, description: Document lifecycle status, including DELETING/DELETED}
        documentId: {type: string, format: uuid}
        title: {type: string}
        fileName: {type: string}
        visibility: {type: string, enum: [ALL_TENANT_USERS, SUPPORT_TEAM_ONLY, LIMITED_ACCESS]}
        tags: {type: array, items: {type: string}}
        status: {type: string, enum: [UPLOADING, QUEUED, PROCESSING, ACTIVE, FAILED, SUPERSEDED, DELETING, DELETED]}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
        mimeType: {type: string}
        sizeBytes: {type: integer, format: int64}
        sha256: {type: string, nullable: true}
        errorCode: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LoginRequest:
      type: object
      required: [tenantCode, email, password]
      additionalProperties: false
      properties:
        tenantCode: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$', example: acme}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 128}
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken: {type: string, minLength: 32, maxLength: 512}
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresIn: {type: integer, example: 900}
        user: {$ref: '#/components/schemas/AuthenticatedUser'}
    AuthenticatedUser:
      type: object
      required: [id, tenantId, email, displayName, roles]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        roles:
          type: array
          uniqueItems: true
          items: {type: string, enum: [CUSTOMER, AGENT, ADMIN]}
    CreateTicketRequest:
      type: object
      required: [subject, description]
      properties:
        subject: {type: string, minLength: 3, maxLength: 300}
        description: {type: string, minLength: 10, maxLength: 20000}
        priority: {$ref: '#/components/schemas/Priority'}
    UpdateTicketRequest:
      type: object
      minProperties: 1
      properties:
        subject: {type: string, minLength: 3, maxLength: 300}
        description: {type: string, minLength: 10, maxLength: 20000}
        status: {$ref: '#/components/schemas/TicketStatus'}
        priority: {$ref: '#/components/schemas/Priority'}
        category: {$ref: '#/components/schemas/Category'}
        assigneeId: {type: string, format: uuid, nullable: true}
    Ticket:
      type: object
      required: [id, number, subject, description, priority, status, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, example: SUP-00001234}
        subject: {type: string}
        description: {type: string}
        category: {$ref: '#/components/schemas/Category'}
        priority: {$ref: '#/components/schemas/Priority'}
        status: {$ref: '#/components/schemas/TicketStatus'}
        requesterId: {type: string, format: uuid}
        assigneeId: {type: string, format: uuid, nullable: true}
        aiAnalysis: {$ref: '#/components/schemas/AiAnalysis'}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TicketComment:
      type: object
      required: [id, ticketId, authorId, body, internal, createdAt]
      properties:
        id: {type: string, format: uuid}
        ticketId: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        body: {type: string}
        internal: {type: boolean}
        createdAt: {type: string, format: date-time}
    AiAnalysis:
      type: object
      properties:
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        summary: {type: string, nullable: true}
        suggestedCategory: {$ref: '#/components/schemas/Category'}
        suggestedPriority: {$ref: '#/components/schemas/Priority'}
        generatedAt: {type: string, format: date-time, nullable: true}
    AiJobReference:
      type: object
      required: [jobId, status]
      properties:
        jobId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
    TicketPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, WAITING_CUSTOMER, RESOLVED, CLOSED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    Category:
      type: string
      enum: [ACCOUNT, PAYMENT, TECHNICAL, GENERAL, OTHER]
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string}
        correlationId: {type: string}
        violations:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unauthorized:
      description: Authentication required or invalid
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    TooManyRequests:
      description: Login attempt limit exceeded
      headers:
        Retry-After:
          description: Seconds until another login attempt may be accepted
          schema: {type: integer, minimum: 1}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: Insufficient permission
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Resource not found
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: Domain conflict
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PreconditionFailed:
      description: Optimistic-lock version conflict
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PreconditionRequired:
      description: If-Match is required
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
