spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_db}
    username: ${DB_USERNAME:ticket_service}
    password: ${DB_PASSWORD:local-ticket-db}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:platform}
    password: ${RABBITMQ_PASSWORD:local-rabbitmq}
  flyway:
    enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:ticket-platform}
    jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

ticket:
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
