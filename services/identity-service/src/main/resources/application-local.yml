spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME:identity_service}
    password: ${DB_PASSWORD:local-identity-db}
  data:
    redis:
      url: ${REDIS_URL:redis://:local-redis@localhost:6379}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

identity:
  jwt:
    key-id: ${JWT_KEY_ID:local-2026-01}
    private-key: ${JWT_PRIVATE_KEY_LOCATION:file:./.local/keys/identity-private.pem}
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:./.local/keys/identity-public.pem}
  local-seed:
    enabled: ${LOCAL_SEED_ENABLED:false}
    password: ${LOCAL_SEED_PASSWORD:}
